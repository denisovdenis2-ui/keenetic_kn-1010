name: Build OpenWrt for Keenetic KN-1010

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/dotnet || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget

      - name: Checkout KN-1010 OpenWrt
        uses: actions/checkout@v4
        with:
          repository: andyboxerdev/openwrt
          ref: ramips-add-keenetic-kn-1010
          path: openwrt
          fetch-depth: 1

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure KN-1010
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_keenetic_kn-1010=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          EOF

          make defconfig

          grep "CONFIG_TARGET_ramips_mt7621_DEVICE_keenetic_kn-1010=y" .config
          grep "CONFIG_TARGET_ROOTFS_INITRAMFS=y" .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j8

      - name: Build
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Show firmware
        working-directory: openwrt
        run: |
          find bin/targets/ramips/mt7621/ \
            -type f \
            -name '*keenetic_kn-1010*' \
            -exec ls -lh {} \;

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Keenetic-KN-1010-OpenWrt
          path: |
            openwrt/bin/targets/ramips/mt7621/*keenetic_kn-1010*.bin
            openwrt/bin/targets/ramips/mt7621/sha256sums
          retention-days: 7
